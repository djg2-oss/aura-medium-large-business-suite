<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraG2P Medium-to-Large Business Suite — 10 Best Templates</title>
<style>
:root{--bg:#0b0f0e;--panel:#121a18;--accent:#c9a227;--text:#e8f0ec;--border:#2a3a34;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;}
header{padding:20px;border-bottom:1px solid var(--border);text-align:center;}
.templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.card:hover{border-color:var(--accent);}
.preview{display:none;position:fixed;inset:0;background:#000c;z-index:100;padding:20px;overflow:auto;}
.preview.active{display:block;}
video{width:100%;max-height:280px;background:#000;}
button{background:#1a2421;color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>
<header>
<h1>AuraG2P Medium-to-Large Business Suite</h1>
<p>One website/app · 10 best templates for scale · Explicit video player · Shared memory · Multi-location ready</p>
</header>
<div class="templates" id="grid"></div>
<div class="preview" id="preview">
<button onclick="closePreview()">Close</button>
<div id="preview-content"></div>
<video controls id="vid"></video>
<input type="file" accept="video/*" onchange="document.getElementById('vid').src=URL.createObjectURL(this.files[0])">
<p>Explicit HTML5 video player.</p>
</div>
<script>
const templates = [
  {id:1, name:'Multi-Site Clinic / Healthcare Group', desc:'Locations, services per site, patient portal hooks, team, testimonials, booking system.'},
  {id:2, name:'Law Firm / Professional Services Firm', desc:'Practice areas, attorneys, case results, matter intake, resources, contact.'},
  {id:3, name:'Architecture / Design Studio', desc:'Project portfolio grid, services, team, process, contact/RFQ.'},
  {id:4, name:'Film / Production Company', desc:'Projects/reels, services, team, equipment, booking, portfolio.'},
  {id:5, name:'Research Lab / R&D Organization', desc:'Research areas, publications, team, facilities, news, contact.'},
  {id:6, name:'Brokerage / Financial Services', desc:'Services, team, market insights, client portal CTA, compliance notes.'},
  {id:7, name:'Hotel Group / Hospitality', desc:'Properties, amenities, booking, experiences, locations, contact.'},
  {id:8, name:'Manufacturer / Industrial', desc:'Products/capabilities, facilities, quality, industries served, RFQ.'},
  {id:9, name:'Agency Holding / Multi-Brand', desc:'Brands, case studies, services, team, contact for partnerships.'},
  {id:10, name:'Enterprise SaaS / Platform', desc:'Features, use cases, pricing tiers, security, integrations, demo CTA.'}
];
const grid = document.getElementById('grid');
templates.forEach(t => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><button>Preview Template</button>`;
  card.querySelector('button').onclick = () => {
    document.getElementById('preview-content').innerHTML = `<h2>${t.name}</h2><p>${t.desc}</p><p>Scaffold ready for Codeless Builder. Shared memory key g2p-os-memory.</p><button onclick="alert('Scaffold applied to shared memory.')">Apply</button>`;
    document.getElementById('preview').classList.add('active');
  };
  grid.appendChild(card);
});
function closePreview(){ document.getElementById('preview').classList.remove('active'); }
</script>
</body>
</html>
