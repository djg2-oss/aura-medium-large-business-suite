<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraG2P Medium-to-Large Business Suite — 10 Best Templates</title>
<style>
:root{--bg:#0b0f0e;--panel:#121a18;--accent:#c9a227;--text:#e8f0ec;--border:#2a3a34;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;}
header{padding:20px;border-bottom:1px solid var(--border);text-align:center;}
.templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;}
.card:hover{border-color:var(--accent);}
.preview{display:none;position:fixed;inset:0;background:#000c;z-index:100;padding:20px;overflow:auto;}
.preview.active{display:block;}
video{width:100%;max-height:300px;background:#000;}
button{background:#1a2421;color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:4px;cursor:pointer;}
button:hover{border-color:var(--accent);}
</style>
</head>
<body>
<header>
<h1>AuraG2P Medium-to-Large Business Suite</h1>
<p>One website/app · 10 best templates · Explicit video player · Shared memory ready</p>
</header>
<div class="templates" id="grid"></div>
<div class="preview" id="preview">
<button onclick="closePreview()">Close</button>
<div id="preview-content"></div>
<video controls id="vid"></video>
<input type="file" accept="video/*" onchange="document.getElementById('vid').src=URL.createObjectURL(this.files[0])">
<p>Explicit HTML5 video player (required).</p>
</div>
<script>
const templates = [
  {id:1, name:'Corporate/Enterprise', desc:'Home, about, leadership, careers, investors, news, contact.'},
  {id:2, name:'E-commerce Store', desc:'Products, cart, checkout, categories, account, support.'},
  {id:3, name:'Agency/Creative Studio', desc:'Work portfolio, case studies, team, services, blog, contact.'},
  {id:4, name:'SaaS Product', desc:'Hero, features, pricing tiers, docs, blog, login, integrations.'},
  {id:5, name:'Education/Training', desc:'Courses, instructors, enrollment, schedule, resources, about.'},
  {id:6, name:'Healthcare Practice', desc:'Services, providers, appointments, patient portal, about, contact.'},
  {id:7, name:'Law Firm', desc:'Practice areas, attorneys, case results, resources, contact, blog.'},
  {id:8, name:'Manufacturing', desc:'Products, capabilities, quality, locations, careers, contact.'},
  {id:9, name:'Multi-location Retail', desc:'Locations, products, offers, careers, about, contact.'},
  {id:10, name:'Membership/Community Platform', desc:'Join, benefits, events, members, content, account.'}
];
const grid = document.getElementById('grid');
templates.forEach(t => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><button>Preview / Use Template</button>`;
  card.querySelector('button').onclick = () => showPreview(t);
  grid.appendChild(card);
});
function showPreview(t) {
  document.getElementById('preview-content').innerHTML = `<h2>${t.name}</h2><p>${t.desc}</p><p>Static HTML export ready. Integrates with Codeless Builder and G2PTechOffice shared memory for elite ops.</p><button onclick="alert('Template scaffolded into shared memory (g2p-os-memory).')">Apply to Shared Memory</button>`;
  document.getElementById('preview').classList.add('active');
}
function closePreview() { document.getElementById('preview').classList.remove('active'); }
</script>
</body>
</html>
