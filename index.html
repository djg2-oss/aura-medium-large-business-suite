<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>G2P Medium–Large Suite</title>
<style>
body{margin:0;background:#0e1412;color:#e7efe9;font-family:system-ui}
header{display:flex;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #24302b}
.layout{display:grid;grid-template-columns:220px 1fr 260px}
a,button{color:#d7c08a;background:transparent;border:1px solid #345046;padding:8px;cursor:pointer}
.panel{padding:16px;border-right:1px solid #24302b} .kpi{font-size:28px}
table{width:100%;border-collapse:collapse} td{border-bottom:1px solid #24302b;padding:8px}
video{width:100%;background:#000}
</style></head><body>
<header><strong>G2P Medium–Large</strong><span id="name">Multi-site operator</span></header>
<div class="layout">
<nav class="panel" id="nav"></nav>
<section class="panel">
  <div class="kpi" id="kpi">10 templates</div>
  <p id="blurb"></p>
  <table id="tbl"></table>
  <h3>Explicit video player</h3>
  <video controls id="vid"></video>
  <input type="file" accept="video/*" id="vf"/>
</section>
<aside class="panel"><b>Operating rules</b><ul><li>Regions, roles, audit</li><li>One brand system</li><li>Static shell, API later</li><li>Host on AuraXur only as checkpoint</li></ul></aside>
</div>
<script>
const T=[
["Multi-site clinic group","Regions, credentialing, referral SLA"],
["Hotel / venue group","Occupancy, events, brand standards"],
["Regional retailer","Stores, inventory, campaigns"],
["B2B manufacturer","Plants, orders, QA lots"],
["Professional network","Offices, matters, conflicts"],
["Media network","Shows, rights, release calendar"],
["Logistics operator","Lanes, exceptions, POD"],
["Education group","Campuses, terms, enrollment"],
["Property portfolio","Assets, leases, capex"],
["Holding company","Subsidiaries, board pack, KPIs"]
];
function show(i){
  document.getElementById("name").textContent=T[i][0];
  document.getElementById("blurb").textContent=T[i][1];
  document.getElementById("tbl").innerHTML="<tr><td>Role</td><td>Operator / regional / HQ</td></tr><tr><td>Modules</td><td>Pipeline, people, files, player, audit</td></tr><tr><td>Deploy</td><td>/apps/web /apps/api /release</td></tr>";
  document.getElementById("nav").innerHTML=T.map((t,j)=>`<button data-i="${j}">${j+1}. ${t[0]}</button>`).join("<br/>");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>show(+b.dataset.i));
}
document.getElementById("vf").onchange=e=>{const f=e.target.files[0];if(f)document.getElementById("vid").src=URL.createObjectURL(f)};
show(0);
</script></body></html>
